name: decode-binary-once
on:
  push:
    branches: [gh-pages]
    paths: ['img/*.b64']
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 images, then remove the .b64 files and this one-shot workflow
        run: |
          set -e
          for f in img/*.b64; do base64 -d "$f" > "${f%.b64}"; sha256sum "${f%.b64}"; git rm -q "$f"; done
          git rm -q .github/workflows/decode-binary-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          git commit -m "v3.6: decode og-hero JPG with new headline (binary), remove one-shot decode workflow"
          git push
